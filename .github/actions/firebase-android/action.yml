name: Configure Firebase Android
description: Provision dev/prod Android client configuration, with demo fallback for untrusted checks
inputs:
  dev-json:
    description: Development google-services.json
    required: false
  prod-json:
    description: Production google-services.json
    required: false
runs:
  using: composite
  steps:
    - name: Write variant configuration
      shell: bash
      env:
        FIREBASE_ANDROID_DEV_JSON: ${{ inputs.dev-json }}
        FIREBASE_ANDROID_PROD_JSON: ${{ inputs.prod-json }}
      run: python3 .github/scripts/firebase_config.py --allow-demo
