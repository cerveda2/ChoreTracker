name: Deploy Firebase

# Called after validated backend changes on main (dev), or backend-changing releases (prod).
# Manual dev dispatches preview a branch; manual prod dispatches must target main.
on:
  workflow_call:
    inputs:
      project:
        description: ".firebaserc alias to deploy to (dev or prod)"
        required: true
        type: string
    # The caller must pass it by name even though it lives in the dev/prod environment - otherwise it
    # silently arrives empty.
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true
  workflow_dispatch:
    inputs:
      project:
        description: ".firebaserc alias to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Applies to both reusable callers and manual dispatches.
    if: inputs.project != 'prod' || github.ref == 'refs/heads/main'
    environment: ${{ inputs.project }}
    concurrency:
      group: deploy-firebase-${{ inputs.project }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up Java for manual deployment tests
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate a manual deployment
        if: github.event_name == 'workflow_dispatch'
        working-directory: functions
        run: npm run test:emulators

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy rules, indexes and functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "$PROJECT" = "dev" ]; then
            set -- --force
          else
            set --
          fi
          firebase deploy --non-interactive --project "$PROJECT" --only firestore,functions "$@"

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
