name: Deploy Firebase

# Deploys Firestore rules + indexes and Cloud Functions to one Firebase project. Called by
# android.yml (dev, on every PR and push to main) and release.yml (prod, on a version tag), and
# runnable by hand from the Actions tab for a backend-only fix.
on:
  workflow_call:
    inputs:
      project:
        description: ".firebaserc alias to deploy to (dev or prod)"
        required: true
        type: string
    # The caller must pass it by name even though it lives in the dev/prod environment - otherwise it
    # silently arrives empty.
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true
  workflow_dispatch:
    inputs:
      project:
        description: ".firebaserc alias to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy to ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production only ships from main: a manual run must be dispatched on main, and release.yml only
    # runs on main. The prod environment's secret is also restricted to main.
    if: github.event_name != 'workflow_dispatch' || inputs.project != 'prod' || github.ref == 'refs/heads/main'
    environment: ${{ inputs.project }}
    concurrency:
      group: deploy-firebase-${{ inputs.project }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy rules, indexes and functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: firebase deploy --project ${{ inputs.project }} --only firestore,functions

      - name: Remove service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
