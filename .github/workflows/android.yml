name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main are queued instead, so a deploy is never killed
  # mid-flight by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wrapper-validation:
    name: Wrapper validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle below already caches the Gradle User Home - setup-java's own `cache: gradle`
      # would duplicate that with a separate, less precise cache of the same paths.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run Detekt
        # detektMain/detektTest add type-resolution-aware analysis (a stricter rule set) for the
        # plain-Kotlin/JVM modules (core:domain, core:model, ...) - detekt's Gradle plugin only
        # auto-generates those type-resolution tasks for Kotlin JVM source sets, not for Android
        # modules, so the Android modules are still covered by the classic `detekt` task only.
        run: ./gradlew detekt detektMain detektTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle below already caches the Gradle User Home - setup-java's own `cache: gradle`
      # would duplicate that with a separate, less precise cache of the same paths.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run unit tests
        # 'test' (not 'testDebugUnitTest') so the plain-JVM modules (core:domain, core:model,
        # core:common, ...) are covered too - testDebugUnitTest only exists on Android modules
        # and silently skips those, so their tests never gated a PR.
        run: ./gradlew test

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle below already caches the Gradle User Home - setup-java's own `cache: gradle`
      # would duplicate that with a separate, less precise cache of the same paths.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: choretracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  assemble-release:
    name: Assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle below already caches the Gradle User Home - setup-java's own `cache: gradle`
      # would duplicate that with a separate, less precise cache of the same paths.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Assemble release
        # Unsigned (CI has no choretracker.release.* signing properties) - this job exists to catch
        # R8 / resource-shrinking breakage before merge rather than at release time. The Crashlytics
        # mapping upload is skipped since these builds are never distributed.
        run: ./gradlew assembleRelease -x uploadCrashlyticsMappingFileRelease

  functions-typecheck:
    name: Cloud Functions typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build (typecheck)
        # Same command firebase deploy's predeploy hook runs (deploy-firebase.yml) - surfaces a broken
        # TypeScript change as its own failing check instead of only as a failed deploy.
        working-directory: functions
        run: npm run build

  # Every PR and every push to main deploys to dev; production only ships with a release
  # (release.yml).
  deploy-dev:
    name: Deploy Firebase (dev)
    uses: ./.github/workflows/deploy-firebase.yml
    with:
      project: dev
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
